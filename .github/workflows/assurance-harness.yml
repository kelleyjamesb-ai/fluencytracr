name: Assurance Harness

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DATABASE_URL: postgresql://fluency:fluency@localhost:5432/fluency?schema=public
  DIRECT_URL: postgresql://fluency:fluency@localhost:5432/fluency?schema=public
  C1_RUNTIME_DATABASE_PASSWORD: c1_assurance_runtime_2026
  C1_RUNTIME_DATABASE_URL: postgresql://fluencytracr_c1_runtime:c1_assurance_runtime_2026@localhost:5432/fluency?schema=public
  SLICE_E_RUNTIME_DATABASE_URL: postgresql://fluencytracr_slice_e_runtime:slice_e_assurance_runtime_2026@localhost:5432/fluency?schema=public
  SLICE_E_CANONICAL_IDENTITY_ATTESTATION_ACTIVE_WRITE_KEY_ID: FT_E_HMAC_PRIMARY
  SLICE_E_CANONICAL_IDENTITY_ATTESTATION_ACTIVE_WRITE_SECRET: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI
  SLICE_E_CANONICAL_IDENTITY_ATTESTATION_RETAINED_READ_KEYS_JSON: '{}'
  C1_CREATION_ATTESTATION_ACTIVE_KEY_ID: FT_C1_HMAC_PRIMARY
  C1_CREATION_ATTESTATION_KEYS_JSON: '{"FT_C1_HMAC_PRIMARY":"AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE"}'
  JWT_SECRET: dev-secret
  DEV_HEADER_AUTH: "true"
  BACKEND_URL: http://localhost:4000
  BATCH_SIZE: "25"
  SAMPLE_LIMIT: "10000"
  SKIP_IDEMPOTENCY: "true"
  PROGRESS_EVERY: "500"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  dogfood-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run dogfood end-to-end harness
        run: python -m unittest tests.test_dogfood_e2e

  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fluency
          POSTGRES_PASSWORD: fluency
          POSTGRES_DB: fluency
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluency -d fluency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace shared

      - name: Precreate restricted database roles
        run: npx prisma db execute --file scripts/assurance_precreate_restricted_roles.sql --schema backend/prisma/schema.prisma

      - name: Create current schema in fresh CI database
        run: npx prisma db push --schema backend/prisma/schema.prisma --skip-generate

      - name: Baseline existing migrations for CI schema
        run: |
          for migration in backend/prisma/migrations/*; do
            if [ -d "$migration" ]; then
              npx prisma migrate resolve --schema backend/prisma/schema.prisma --applied "$(basename "$migration")"
            fi
          done

      - name: Run Prisma migrations
        run: npx prisma migrate deploy --schema backend/prisma/schema.prisma

      - name: Install C.0 constraints and guards on baselined schema
        run: npx prisma db execute --file backend/prisma/post_push/20260728120000_c0_constraints_and_guards.sql --schema backend/prisma/schema.prisma

      - name: Restore historical source-table RLS before C.1
        run: npx prisma db execute --file scripts/assurance_apply_historical_source_rls.sql --schema backend/prisma/schema.prisma

      - name: Install C.1 comparison privacy constraints and guards
        run: npx prisma db execute --file backend/prisma/post_push/20260728210000_outcome_comparison_privacy_release.sql --schema backend/prisma/schema.prisma

      - name: Install Slice E canonical identity family-head authority
        run: npx prisma db execute --file backend/prisma/post_push/20260728230000_canonical_identity_family_head.sql --schema backend/prisma/schema.prisma

      - name: Generate Prisma client
        run: npx prisma generate --schema backend/prisma/schema.prisma

      - name: Build backend for C.0 application-path verification
        run: npm run build --workspace backend

      - name: Verify C.0 PostgreSQL tombstones and races
        run: node scripts/verify_cohort_proof_postgres.mjs

      - name: Verify C.1 PostgreSQL atomic comparison privacy
        env:
          C1_VERIFY_EPHEMERAL_DATABASE: "1"
        run: node scripts/verify_outcome_comparison_privacy_postgres.mjs

      - name: Verify Slice D PostgreSQL aggregate claim authorization
        env:
          D_VERIFY_EPHEMERAL_DATABASE: "1"
          DEV_HEADER_AUTH: "true"
          NODE_ENV: development
        run: node scripts/verify_aggregate_claim_authorization_postgres.mjs

      - name: Run seed self-test
        run: npm run test:seed

      - name: Start backend
        env:
          NODE_ENV: development
        run: |
          npm run dev --workspace backend > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for Postgres-backed health
        run: |
          node - <<'NODE'
          const deadline = Date.now() + 120_000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          while (Date.now() < deadline) {
            try {
              const response = await fetch("http://localhost:4000/health");
              const body = await response.json();
              console.log(JSON.stringify(body));
              if (response.ok && body.status === "ok" && body.db === "postgres") {
                process.exit(0);
              }
            } catch (error) {
              console.log(`Waiting for backend: ${error.message}`);
            }
            await sleep(2000);
          }
          console.error("Backend did not report db: postgres before timeout");
          process.exit(1);
          NODE

      - name: Install synthetic LMSYS CI fixture
        run: |
          mkdir -p data/lmsys
          cp tests/fixtures/lmsys-ci-sample.jsonl data/lmsys/conversations.jsonl

      - name: Seed LMSYS sample
        run: npm run seed:lmsys:sample

      - name: Verify assurance properties
        run: npm run verify:assurance

      - name: Upload assurance report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: assurance-report
          path: scripts/assurance-report.md
          if-no-files-found: error

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: assurance-backend-log
          path: backend.log
          if-no-files-found: warn
